name: AI Nexus — Crawl & Enrich Pipeline

on:
  # Scheduled: every 2 hours (safe within free tier 2000 min/month)
  schedule:
    - cron: "0 */2 * * *"

  # Manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles to enrich (default 30)"
        required: false
        default: "30"
      max_age:
        description: "Max article age in hours (0 = default 4h)"
        required: false
        default: "0"
      skip_cluster:
        description: "Skip LLM semantic clustering"
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  crawl:
    name: Crawl → Deduplicate → Enrich → Persist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout code ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ─────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 3. Cache pip dependencies ───────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ─────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Run pipeline ─────────────────────────────────────
      - name: Run AI Nexus pipeline
        env:
          # Database (Supabase)
          user: ${{ secrets.SUPABASE_DB_USER }}
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          host: ${{ secrets.SUPABASE_DB_HOST }}
          port: ${{ secrets.SUPABASE_DB_PORT }}
          dbname: ${{ secrets.SUPABASE_DB_NAME }}
          # MiniMax LLM
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          # Optional
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # Reduce log noise
          LOG_LEVEL: WARNING
        run: |
          python main.py \
            --skip-cluster \
            --limit ${{ github.event.inputs.limit || '30' }} \
            --max-age ${{ github.event.inputs.max_age || '0' }}

      # ── 6. Summary ──────────────────────────────────────────
      - name: Pipeline summary
        if: always()
        run: echo "Pipeline finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
