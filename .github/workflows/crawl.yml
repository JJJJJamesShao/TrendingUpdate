name: AI Nexus — Crawl & Enrich Pipeline

on:
  schedule:
    # Every 2h. At 12:00 UTC we set FETCH_DAILY_FEEDS=1 (hot + 92 OPML blogs); else hot only.
    - cron: "0 */2 * * *"

  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles to enrich (default 30)"
        required: false
        default: "30"
      max_age:
        description: "Max article age in hours (0 = default 4h)"
        required: false
        default: "0"
      skip_cluster:
        description: "Skip LLM semantic clustering"
        required: false
        type: boolean
        default: true
      daily_feeds:
        description: "Include 92 OPML blog feeds (slower, use for full daily run)"
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  crawl:
    name: Crawl → Deduplicate → Enrich → Persist
    runs-on: ubuntu-latest
    # 10 min usually enough for hot-only; daily (107 sources) may need more
    timeout-minutes: 25

    steps:
      # ── 1. Checkout code ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ─────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 3. Cache pip dependencies ───────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ─────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Run pipeline ─────────────────────────────────────
      - name: Run AI Nexus pipeline
        env:
          user: ${{ secrets.SUPABASE_DB_USER }}
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          host: ${{ secrets.SUPABASE_DB_HOST }}
          port: ${{ secrets.SUPABASE_DB_PORT }}
          dbname: ${{ secrets.SUPABASE_DB_NAME }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          LOG_LEVEL: WARNING
        run: |
          # UTC 08:00–11:00 = include 92 OPML blogs (daily full run); 2h cron hits 8 and 10 → ≥1 full/day
          H=$(date -u +%H); [ "$H" -ge 8 ] && [ "$H" -le 11 ] && export FETCH_DAILY_FEEDS=1 || true
          [ "${{ github.event.inputs.daily_feeds }}" = "true" ] && export FETCH_DAILY_FEEDS=1 || true
          python main.py \
            --skip-cluster \
            --limit ${{ github.event.inputs.limit || '30' }} \
            --max-age ${{ github.event.inputs.max_age || '0' }}

      # ── 6. Summary ──────────────────────────────────────────
      - name: Pipeline summary
        if: always()
        run: echo "Pipeline finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
